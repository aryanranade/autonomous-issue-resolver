name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Type-check (mypy, strict)
        run: mypy

      # The SWE-bench instance-image tests skip automatically unless the (multi-GB)
      # images are present, so CI runs the unit suite + the lightweight Docker
      # sandbox tests without needing to pull them.
      - name: Test
        run: pytest -q
